name: DotGlass - bramble - Red Dot Build 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Setup env
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc rsync python3 python3-pip repo

      - name: Init DotGlass manifest
        run: |
          mkdir -p ~/dotglass && cd ~/dotglass
          repo init -u https://github.com/Ojoruwa/dotglass_manifest.git -b main --git-lfs --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc --all) --force-sync --optimized-fetch --prune

      - name: Apply DotGlass Glass QS patch
        run: |
          cd ~/dotglass
          if [ -f vendor/dotglass/patches/0001-DotGlass-Glass-QS.patch ]; then
            git -C frameworks/base apply --check vendor/dotglass/patches/0001-DotGlass-Glass-QS.patch || echo "Patch check failed, skipping"
            git -C frameworks/base apply vendor/dotglass/patches/0001-DotGlass-Glass-QS.patch || echo "Patch apply failed, continuing with branding only"
          fi

      - name: Build DotGlass for bramble
        run: |
          cd ~/dotglass
          source build/envsetup.sh
          lunch lineage_bramble-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: DotGlass-bramble-RedDot-B1
          path: ~/dotglass/out/target/product/bramble/*.zip
          retention-days: 7
